name: CI
on:
  push:
    branches: [trunk]
  pull_request:
jobs:
  build:
    strategy:
      matrix:
        job: [typecheck-glue, typecheck-sync-knowledge, typecheck-eval, chatwoot-initializer-tests, compose-validate, build-glue]
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test ! -f RED
